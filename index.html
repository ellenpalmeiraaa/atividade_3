<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Troco Verificado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Problema "troco_verificado"</h2>
        
        <div class="input-group">
            <label for="preco">Preço unitário do produto:</label>
            <input type="number" id="preco" step="0.01" placeholder="Ex: 8.00">
        </div>
        
        <div class="input-group">
            <label for="quantidade">Quantidade comprada:</label>
            <input type="number" id="quantidade" placeholder="Ex: 2">
        </div>
        
        <div class="input-group">
            <label for="dinheiro">Dinheiro recebido:</label>
            <input type="number" id="dinheiro" step="0.01" placeholder="Ex: 20.00">
        </div>
        
        <button onclick="calcularTroco()">Calcular</button>
        
        <div id="resultado" class="resultado">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
